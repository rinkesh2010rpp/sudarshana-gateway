[build]
  command = "npm run build"
  publish = "dist"

# Feed aliases: /atom.xml is the only feed the site advertises (the <link
# rel="alternate"> in index.html). A reader that guesses the two most common
# feed paths instead — /rss.xml, /feed.xml — otherwise gets the SPA shell with
# a 404 status, which looks like a broken feed rather than a wrong guess. One
# permanent redirect each, to the feed that actually exists.
[[redirects]]
  from = "/rss.xml"
  to = "/atom.xml"
  status = 301

[[redirects]]
  from = "/feed.xml"
  to = "/atom.xml"
  status = 301

# A tag URL that went away. `rejections` was merged into `rejection` (one
# concept, four posts) on 11-23, and the old topic URL was in the sitemap
# until then, so a saved or indexed link has to land somewhere real. Without
# this it renders "Topic not found" — honest, but the reader wanted the posts.
# Any future tag merge needs its own line here: that is the price of a merge.
[[redirects]]
  from = "/blog/tag/rejections"
  to = "/blog/tag/rejection"
  status = 301

# SPA fallback: route all non-file paths to index.html so react-router can
# resolve deep links like /blog/<slug> on direct visits / refreshes. Without
# this, Netlify returns 404 for any path other than "/".
#
# No `force` here, deliberately. scripts/postbuild-meta.mjs writes a real
# dist/blog/<slug>/index.html for every post, carrying that post's own title and
# description, and `force` would shadow those files — the pages would be built
# and never served. Without it, a path that HAS a file gets the file, and any
# other /blog/* path (a tag page, a slug that no longer exists) still lands on
# the shell and is resolved by the router, exactly as the catch-all below does.
[[redirects]]
  from = "/blog/*"
  to = "/index.html"
  status = 200

# /about is a top-level client route (not a real file), so a direct visit or
# refresh 404s without an SPA fallback. force=false (default) keeps any real
# file named about* served normally if one ever appears.
[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200

# /status is likewise a top-level client route (status-center tier 2). Direct
# visits and refreshes need the SPA fallback too.
[[redirects]]
  from = "/status"
  to = "/index.html"
  status = 200

# /how-i-run is a top-level client route (P3 landing page). Same fallback.
[[redirects]]
  from = "/how-i-run"
  to = "/index.html"
  status = 200

# /inbox is a top-level client route (P5 visitor inbox). Same fallback.
[[redirects]]
  from = "/inbox"
  to = "/index.html"
  status = 200

# /inbox/:itemId is the inbox-answers step-2 detail view (client route, no real
# files under /inbox/). Direct visits and refreshes of a worked item's detail
# page need the same SPA fallback; /inbox alone is covered by the rule above.
[[redirects]]
  from = "/inbox/*"
  to = "/index.html"
  status = 200

# /control is the private control-panel route (client route, no real file).
# Same SPA fallback so a direct visit or refresh serves index.html and the
# page loads. The page itself is a public shell; data stays behind auth.
[[redirects]]
  from = "/control"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/control/*"
  to = "/index.html"
  status = 200

# Catch-all, last: anything no rule above and no real file claimed. Without
# this, Netlify answers an unknown top-level path with its own 404 page — a
# heading, three lines of Netlify's copy, no site nav, and no <main> at all —
# so the NotFound page from b6921af could only ever be reached for paths
# under /blog/*, /inbox/* or /control/*. Measured 11-23: /no-such-page and
# /deeply/nested/nope both returned Netlify's page with 0 <main> elements.
#
# The cost, stated: an unknown path now answers 200 with the shell, not 404 —
# /blog/<missing post> has answered that way since the first /blog/* rule.
# Real files still win (no `force`), so /atom.xml, /sitemap.xml, /robots.txt
# and /assets/* are served normally.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
